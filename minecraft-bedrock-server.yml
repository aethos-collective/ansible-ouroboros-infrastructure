---
- name: Install Minecraft Bedrock Server.
  hosts: minecraft_bedrock_server

  vars:
    server_name: "{{ family_cloud_name }} MC" # defined in /inventory/group_vars/all.yml
    level_name: "CP ~ Creative & Peaceful"
    game_mode: "creative"
    difficulty: "peaceful"

  tasks:
    - name: "Ensure Docker volume for Minecraft Bedrock Server named {{ server_name | quote }} is created."
      community.docker.docker_volume:
        name: minecraft_bedrock_server_volume
        # TODO: get volume moved to Atomic Pi's SD card

    - name: "Ensure Docker container for Minecraft Bedrock Server named {{ server_name | quote }} hosting level named {{ level_name | quote }} is started."
      community.docker.docker_container:
        name: minecraft-bedrock-server
        image: itzg/minecraft-bedrock-server:latest
        pull: true
        state: started
        restart_policy: always
        container_default_behavior: "compatibility"
        ports:
          - "{{ port_ipv4 }}:{{ port_ipv4 }}/udp" # defined in /inventory/group_vars/minecraft_bedrock_server.yml
          - "{{ port_ipv6 }}:{{ port_ipv6 }}/udp" # defined in /inventory/group_vars/minecraft_bedrock_server.yml
        env:
          EULA: "TRUE"
          VERSION: "LATEST"
          SERVER_PORT: "{{ port_ipv4 | quote }}" # defined in /inventory/group_vars/minecraft_bedrock_server.yml
          SERVER_PORT_V6: "{{ port_ipv6 | quote }}" # defined in /inventory/group_vars/minecraft_bedrock_server.yml
          SERVER_NAME: "{{ server_name }}"
          LEVEL_NAME: "{{ level_name }}"
          GAMEMODE: "{{ game_mode }}"
          DIFFICULTY: "{{ difficulty }}"
          SERVER_AUTHORITATIVE_MOVEMENT: "server-auth-with-rewind"
          CORRECT_PLAYER_MOVEMENT: "true"
          SERVER_AUTHORITATIVE_BLOCK_BREAKING: "true"
        volumes:
          - minecraft_bedrock_server_volume:/data
