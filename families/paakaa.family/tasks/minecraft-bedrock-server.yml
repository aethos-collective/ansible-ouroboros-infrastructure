---
- name: Load Minecraft Bedrock Server configuration variables.
  ansible.builtin.include_vars: vars/minecraft-bedrock-server.yml
  tags: [ configuration ]

- name: "Ensure Docker volume for Minecraft Bedrock Server named {{ server_name | quote }} is created."
  community.docker.docker_volume:
    name: minecraft_bedrock_server_volume
    # TODO: get volume moved to Atomic Pi's SD card and backed up
  when: "'minecraft_bedrock_server' in group_names"
  tags: [ configuration ]

- name: "Ensure Docker container for Minecraft Bedrock Server named {{ server_name | quote }} hosting level named {{ level_name | quote }} is started."
  community.docker.docker_container:
    name: minecraft-bedrock-server
    image: itzg/minecraft-bedrock-server:latest
    pull: true
    state: started
    restart_policy: always
    container_default_behavior: "compatibility"
    ports:
    - "{{ udp_port_minecraft_bedrock_server_ipv4 }}:{{ udp_port_minecraft_bedrock_server_ipv4 }}/udp"
    - "{{ udp_port_minecraft_bedrock_server_ipv6 }}:{{ udp_port_minecraft_bedrock_server_ipv6 }}/udp"
    env:
      EULA: "TRUE"
      VERSION: "LATEST"
      SERVER_PORT: "{{ udp_port_minecraft_bedrock_server_ipv4 | quote }}"
      SERVER_PORT_V6: "{{ udp_port_minecraft_bedrock_server_ipv6 | quote }}"
      SERVER_NAME: "{{ server_name }}"
      LEVEL_NAME: "{{ level_name }}"
      GAMEMODE: "{{ game_mode }}"
      DIFFICULTY: "{{ difficulty }}"
      SERVER_AUTHORITATIVE_MOVEMENT: "server-auth-with-rewind"
      CORRECT_PLAYER_MOVEMENT: "true"
      SERVER_AUTHORITATIVE_BLOCK_BREAKING: "true"
    volumes:
    - minecraft_bedrock_server_volume:/data
  when: "'minecraft_bedrock_server' in group_names"
  tags: [ installation, configuration, containers ]

- name: TODO - Set up Minecraft Bedrock Server forwarding.
  ansible.builtin.debug: var=minecraft_bedrock_server_nebula_internal_ip
  when: "'minecraft_bedrock_server_proxy' in group_names"
  tags: [ configuration, reverse_proxy ]
