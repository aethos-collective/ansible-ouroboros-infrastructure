---
# TODO: Add support for systemd systems, too.

- name: Copy notify_slack.sh init script with owner and permissions.
  become: true
  ansible.builtin.template:
    src: templates/slack/notify_slack.sh.j2
    dest: /etc/init.d/notify_slack
    owner: root
    group: root
    mode: '0744'
  vars:
    slack_url: !vault |
          $ANSIBLE_VAULT;1.2;AES256;paakaa.family
          66663338346536323862366363306665333332396464393630663064316438326335666332636165
          6236343237323863323830343236363532303066316563660a626536623036316366336137303939
          35396162353439666565396334333363303163623231333736363032326666336639386134383266
          6235626532636339630a353431613965323561343166646661636665613831373930643265633963
          33346462643464346262336331633438623962306465333966376534323037393532306364366564
          37303964366630386465353331306138346464333435383265376230356634643165626165333930
          33326539356139316538386132396465336130323335353238356232626464383736616136636533
          64316461303230623237
    slack_channel: "#tech-smarthome-logs"
    slack_username: "paakaa-family"
    slack_icon_emoji: ":paakaa-family:"
  tags: [ sudo, configuration ]

- name: Make sure notify_slack is registered and started.
  become: true
  ansible.builtin.service:
    name: notify_slack
    state: started
    enabled: true
  tags: [ sudo, configuration ]
