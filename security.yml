---
- name: Update security settings on dedicated hosts.
  become: true
  hosts: dedicated

  vars:
    security_autoupdate_reboot: true
    security_autoupdate_mail_to: "christopher@parker.jetzt"
    security_ssh_password_authentication: "yes"
    
    firewall_flush_rules_and_chains: false # Docker
    firewall_allowed_tcp_ports:
      - "22" # SSH
      - "80" # Web
      - "9090" # Cockpit

  roles:
    - geerlingguy.security
    - geerlingguy.firewall
