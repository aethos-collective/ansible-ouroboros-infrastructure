---
- tags: [ core_utils, coreutils, core, utils, packages, installation, termux, apt ]
  block:

  - when: "'termux' in group_names"
    tags: [ termux, packages, installation ]
    block:
    - name: Check if python-apt is installed on Termux hosts.
      ansible.builtin.shell:
        cmd: 'python -c "import apt"'
      register: python_apt_is_installed
      changed_when: python_apt_is_installed.rc != 0
      failed_when: false
    - name: Install python-apt on Termux hosts.
      ansible.builtin.include_tasks: tasks/termux/install-python-apt.yml
      when: python_apt_is_installed.rc != 0

  - name: Ensure latest versions of core utility packages are installed on Termux hosts.
    become: false
    vars:
      # Please keep this list alphabetized.
      core_utils_termux:
      - gping
      - okc-agents
      - openssh
      - python # Python 3

      ### https://gist.github.com/oofnikj/e79aef095cd08756f7f26ed244355d62
      - qemu-common
      - qemu-system-x86_64-headless
      - qemu-utils

      - rust
      - termux-api

    ansible.builtin.apt:
        name: "{{ core_utils + core_utils_apt + core_utils_termux }}"
        state: latest
