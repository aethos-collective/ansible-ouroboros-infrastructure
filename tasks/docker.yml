---
- tags: [ installation, containers, networking, firewall, docker ]
  block:

  - name: Ensure pip is installed and install pip package for Docker.
    become: true
    ansible.builtin.import_role:
      name: geerlingguy.pip
    vars:
      pip_install_packages:
      - name: docker
    tags: [ sudo, pip, packages ]

  - name: Install Docker.
    become: true
    ansible.builtin.import_role:
      name: geerlingguy.docker
    vars:
      # Edition can be one of: 'ce' (Community Edition) or 'ee' (Enterprise Edition).
      docker_edition: 'ce'
      docker_package: "docker-{{ docker_edition }}"
      docker_package_state: latest
      docker_service_state: started
      docker_service_enabled: true
      docker_restart_handler_state: restarted
      docker_install_compose: false
      docker_apt_arch_matrix:
        x86_64: 'amd64'
        aarch64: 'arm64'
        armv6: 'armhf'
        armv6l: 'armhf'
        armv7: 'armhf'
        ppc64el: 'ppc64el'
        s390x: 's390x'
      docker_apt_arch: "{{ docker_apt_arch_matrix[ansible_facts['architecture']] }}"
      docker_distribution: "{{ (ansible_facts['lsb'].id if ansible_facts['lsb'] is defined and ansible_facts['lsb'].id  is defined else ansible_distribution) | lower }}"
      docker_apt_repository: "deb [arch={{ docker_apt_arch }}] {{ docker_repo_url }}/{{ docker_distribution }} {{ ansible_distribution_release }} {{ docker_apt_release_channel }}"
    tags: [ sudo, packages ]

  - ansible.builtin.import_tasks: ./docker-compose.yml
    vars:
      docker_compose_install: true
      docker_compose_version: "v2.0.1"
      docker_compose_dir: /usr/libexec/docker/cli-plugins
      docker_compose_filename: docker-compose
    tags: [ docker_compose ]
