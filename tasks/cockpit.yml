---
- name: Load Cockpit configuration variables.
  ansible.builtin.include_vars: vars/cockpit.yml

- name: Ensure Cockpit and accompanying application packages are installed and up-to-date.
  become: true
  ansible.builtin.package:
    name:
      - cockpit
      - cockpit-bridge
      - cockpit-dashboard
      - cockpit-doc
      - cockpit-machines
      - cockpit-networkmanager
      - cockpit-packagekit
      - cockpit-pcp
      - cockpit-storaged
      - cockpit-system
      - cockpit-ws
    state: latest

- name: Check if cockpit-docker package is installed.
  become: true
  ansible.builtin.command: dpkg-query -W {{ cockpit_docker_package }}
  register: cockpit_docker_check_deb
  failed_when: cockpit_docker_check_deb.rc > 1
  changed_when: cockpit_docker_check_deb.rc == 1
  when: "ansible_facts['os_family'] == 'Debian'"

- name: Download cockpit-docker package.
  become: true
  ansible.builtin.get_url:
    url="{{ cockpit_docker_deb_url }}"
    dest="/tmp/{{ cockpit_docker_package }}.deb"
  when: ansible_facts['os_family'] == 'Debian' and cockpit_docker_check_deb.rc == 1

- name: Install cockpit-docker package.
  become: true
  ansible.builtin.apt: deb="/tmp/{{ cockpit_docker_package }}.deb"
  when: ansible_facts['os_family'] == 'Debian' and cockpit_docker_check_deb.rc == 1

- name: Ensure Cockpit configuration file exists.
  become: true
  ansible.builtin.copy:
    content: ""
    dest: '{{ cockpit_config_path }}'
    force: no
    owner: root
    group: root
    mode: '0644'

# https://caddy.community/t/example-cockpit/8283
- name: Configure Cockpit to accept traffic at https://cockpit.HOST_FQDN in addition to https://ANSIBLE_HOST:9090.
  become: true
  ansible.builtin.blockinfile:
    path: '{{ cockpit_config_path }}'
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR COCKPIT CADDY REVERSE PROXY"
    block: |
      [WebService]
      Origins = https://cockpit.{{ host_fqdn }} wss://cockpit.{{ host_fqdn }} https://{{ ansible_host }}:9090
      ProtocolHeader = X-Forwarded-Proto
