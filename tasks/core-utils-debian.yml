---
- tags: [ core_utils, coreutils, core, utils, packages, installation, debian, debian_family, apt ]
  block:

  - name: Initialize baseline fact for Tor Project Debian repository support.
    ansible.builtin.set_fact:
      tor_repo_supported: false

  - name: Add Tor Project repository to Debian-based hosts with supported architectures.
    when: ansible_architecture in [ 'x86_64', 'aarch64', 'i386' ]
    vars: # 2021-10-20 https://support.torproject.org/apt/tor-deb-repo/
      tor_apt_key_path: /usr/share/keyrings/tor-archive-keyring.gpg
    block:

    - name: Update fact for Tor Project Debian repository support.
      ansible.builtin.set_fact:
        tor_repo_supported: true

    - name: Add Tor Project apt key.
      become: true
      ansible.builtin.apt_key: # 2021-10-20 https://support.torproject.org/apt/tor-deb-repo/
        url: https://deb.torproject.org/torproject.org/A3C4F0F979CAA22CDBA8F512EE8CBC9E886DDD89.asc
        id: "A3C4F0F979CAA22CDBA8F512EE8CBC9E886DDD89"
        keyring: "{{ tor_apt_key_path }}"
        state: present

    - name: Add Tor Project repository.
      become: true
      ansible.builtin.apt_repository:
        repo: "{{ item }}"
        filename: tor
        state: present
        update_cache: false
      with_items: # 2021-10-20 https://support.torproject.org/apt/tor-deb-repo/
        - "deb     [signed-by={{ tor_apt_key_path }}] tor+https://deb.torproject.org/torproject.org {{ ansible_facts['distribution_release'] }} main"
        - "deb-src [signed-by={{ tor_apt_key_path }}] tor+https://deb.torproject.org/torproject.org {{ ansible_facts['distribution_release'] }} main"
        - "deb     [signed-by={{ tor_apt_key_path }}] tor+http://deb.torproject.org/torproject.org {{ ansible_facts['distribution_release'] }} main"
        - "deb-src [signed-by={{ tor_apt_key_path }}] tor+http://deb.torproject.org/torproject.org {{ ansible_facts['distribution_release'] }} main"
        - "deb     [signed-by={{ tor_apt_key_path }}] https://deb.torproject.org/torproject.org {{ ansible_facts['distribution_release'] }} main"
        - "deb-src [signed-by={{ tor_apt_key_path }}] https://deb.torproject.org/torproject.org {{ ansible_facts['distribution_release'] }} main"
        - "deb     [signed-by={{ tor_apt_key_path }}] http://deb.torproject.org/torproject.org {{ ansible_facts['distribution_release'] }} main"
        - "deb-src [signed-by={{ tor_apt_key_path }}] http://deb.torproject.org/torproject.org {{ ansible_facts['distribution_release'] }} main"
      register: tor_repo

    - name: Update apt cache if repo was added.
      ansible.builtin.apt:
        update_cache: true
      when: tor_repo.changed

    tags:
    - installation
    - packages
    - tor
    - sudo

  - name: Add official Debian onion service repositories to Debian (NOT Raspbian) hosts.
    # https://wiki.debian.org/DontBreakDebian
    # https://www.raspbian.org/RaspbianFAQ#Can_I_mix_packages_from_the_Debian_repositories_with_Raspbian.3F
    when: ansible_facts['distribution'] == 'Debian' and ansible_facts['lsb'].id != 'Raspbian'
    block:

    - name: Add Debian apt keys.
      become: true
      ansible.builtin.apt_key:
        url: "{{ item.url }}"
        id: "{{ item.fingerprint }}"
        state: present
      with_items: # 2021-10-20 https://ftp-master.debian.org/keys.html
        - url: "https://ftp-master.debian.org/keys/release-{{ ansible_facts['distribution_major_version'] }}.asc"
          fingerprint: 6D33866EDD8FFA41C0143AEDDCC9EFBF77E11517
        - url: "https://ftp-master.debian.org/keys/archive-key-{{ ansible_facts['distribution_major_version'] }}.asc"
          fingerprint: 80D15823B7FD1561F9F7BCDDDC30D7C23CBBABEE
        - url: "https://ftp-master.debian.org/keys/archive-key-{{ ansible_facts['distribution_major_version'] }}-security.asc"
          fingerprint: 5E61B217265DA9807A23C5FF4DFAB270CAA96DFA

    - name: Add Debian onion service repositories.
      become: true
      ansible.builtin.apt_repository:
        repo: "{{ item }}"
        filename: debian-onions
        state: present
        update_cache: false
      with_items: # 2021-10-20 https://onion.debian.org
        - "deb tor+http://2s4yqjx5ul6okpp3f2gaunr2syex5jgbfpfvhxxbbjwnrsvbk5v3qbid.onion/debian          {{ ansible_facts['distribution_release'] }}            main"
        - "deb tor+http://2s4yqjx5ul6okpp3f2gaunr2syex5jgbfpfvhxxbbjwnrsvbk5v3qbid.onion/debian          {{ ansible_facts['distribution_release'] }}-updates    main"
        - "deb tor+http://5ajw6aqf3ep7sijnscdzw77t7xq4xjpsy335yb2wiwgouo7yfxtjlmid.onion/debian-security {{ ansible_facts['distribution_release'] }}/updates    main"
        - "deb tor+http://2s4yqjx5ul6okpp3f2gaunr2syex5jgbfpfvhxxbbjwnrsvbk5v3qbid.onion/debian          {{ ansible_facts['distribution_release'] }}-backports  main"
      register: debian_onion_repos

    - name: Update apt cache if repos were added.
      ansible.builtin.apt:
        update_cache: true
      when: debian_onion_repos.changed

    tags:
    - installation
    - packages
    - tor
    - sudo

  - name: Ensure latest versions of core utility packages are installed on Debian-based hosts.
    become: true
    vars:
      # Please keep this list alphabetized.
      core_utils_debian:
      - apt-transport-https
      - cloud-utils
      - iputils-ping
      - openssh-client
      - openssh-server
      - python3
      - python3-apt
      - rust-doc
      - rustc
    ansible.builtin.apt:
      name: "{{ core_utils + core_utils_apt + core_utils_debian + [ 'deb.torproject.org-keyring' ] if tor_repo_supported else [] }}"
      state: latest
    tags:
    - installation
    - packages
    - sudo
