---
nebula_version: 1.4.0
nebula_directory: /etc/nebula

punchy: true
punch_back: true

listen:
  host: 0.0.0.0
  port: '{{ udp_port_nebula }}'

lighthouses:
# To be populated via task.

pki:
  ca: '{{ nebula_directory }}/ca.crt'
  cert: '{{ nebula_directory }}/{{ nebula.external_addr }}.crt'
  key: '{{ nebula_directory }}/{{ nebula.external_addr }}.key'
