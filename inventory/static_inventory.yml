---
all:
  children:

########################
##### Local groups #####
########################
    pi:
      children:
        raspberry_pi:
        atomic_pi:

    local_dedicated:
      children:
        pi:

    local:
      children:
        local_dedicated:

#########################
##### Remote groups #####
#########################
    remote_dedicated:
      children:
        google_cloud:
        oracle_cloud:

    remote_shared:
      children:
        dreamhost_shared:

    remote:
      children:
        remote_dedicated:
        remote_shared:

######################################
##### Hybrid local/remote groups #####
######################################
    dedicated:
      children:
        local_dedicated:
        remote_dedicated:

    shared:
      children:
        remote_shared:

####################################
##### Solution-oriented groups #####
####################################
    caddy_server:
      children:
        dedicated:

    gitea_server:
      hosts:
        paakaa-pi-0:
    gitea_server_proxy:
      children:
        remote_dedicated:
    META__gitea_server:
      children:
        gitea_server:
        gitea_server_proxy:

    # Make sure nebula_lighthouse group stays last!
    nebula_lighthouse:
      children:
        remote_dedicated:

##########################################################
##### Machine OS/package manager/architecture groups #####
##### ---------------------------------------------- #####
##### Run debug-info.yml playbook to get information #####
##### for updating this section.                     #####
##########################################################
    chromiumos_family:
      children:
        chromiumos:
        chromeos_family:

    chromeos_family:
      children:
        chromeos:

    debian_family:
      children:
        debian:
        ubuntu:

    PKG__choco:
      children:
        windows:

    PKG__apt:
      children:
        debian_family:

    arm64:
      children:
        aarch64:

    arm32:
      children:
        armv6l:

    amd64:
      children:
        x86_64:

    amd32:
      children:
        x86:
