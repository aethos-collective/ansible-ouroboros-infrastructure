---
all:
  children:

##### Local groups
    local:
      hosts:
        chromebook:
        chromebook-termux:
        paakaa-pi-0:
        paakaa-pi-1:
        paakaa-pi-2:

    raspberry_pi:
      hosts:
        paakaa-pi-0:
        paakaa-pi-1:

    atomic_pi:
      hosts:
        paakaa-pi-2:

    pi:
      children:
        raspberry_pi:
        atomic_pi:

    local_dedicated:
      children:
        pi:

##### Remote groups
    google_cloud:
      hosts:
        gcp-free: # always-free

    oracle_cloud:
      hosts:
        oci-free-0: # always-free
        oci-free-1: # always-free
        oci-free-2: # always-free
        oci-free-3: # always-free
        oci-free-4: # always-free
        oci-free-5: # always-free

    dreamhost_shared:
      hosts:
        dreamhost-shared:

    remote_dedicated:
      children:
        google_cloud:
        oracle_cloud:

    remote_shared:
      children:
        dreamhost_shared:

    remote:
      children:
        remote_dedicated:
        remote_shared:

##### Hybrid local/remote groups
    dedicated:
      children:
        local_dedicated:
        remote_dedicated:

    shared:
      children:
        remote_shared:

##### Solution-oriented groups
    caddy_server:
      children:
        dedicated:

    gitea_server:
      hosts:
        paakaa-pi-0:
    gitea_server_proxy:
      children:
        remote_dedicated:
    gitea:
      children:
        gitea_server:
        gitea_server_proxy:

    minecraft_bedrock_server:
      hosts:
        paakaa-pi-2:
    minecraft_bedrock_server_proxy:
      children:
        remote_dedicated:
    minecraft_bedrock:
      children:
        minecraft_bedrock_server:
        minecraft_bedrock_server_proxy:

    # Make sure nebula_lighthouse group stays last!
    nebula_lighthouse:
      children:
        remote_dedicated:

##### Machine distro/architecture groups
    chromeos:
      children:
        chromeos_family:

    chromiumos:
      children:
        chromiumos_family:
        chromeos:

    termux:
      hosts:
        chromebook-termux:

    # Termux is not Debian, but it does use apt
    debian_family:
      children:
        termux:

    arm64:
      children:
        aarch64:

    arm32:
      children:
        armv6l:

    amd64:
      children:
        x86_64:
