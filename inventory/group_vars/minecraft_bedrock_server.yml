---
minecraft_bedrock_server_port_ipv4: 19132
minecraft_bedrock_server_port_ipv6: 19133

# For geerlingguy.firewall role
firewall_allowed_udp_ports:
  - '4242' # Nebula
  - '{{ minecraft_bedrock_server_port_ipv4 }}'
  - '{{ minecraft_bedrock_server_port_ipv6 }}'

# For trozz.ansible_nebula role
inbound:
  - port: any
    proto: icmp
    host: any

  - port: '{{ minecraft_bedrock_server_port_ipv4 }}'
    proto: udp
    host: any

  - port: '{{ minecraft_bedrock_server_port_ipv6 }}'
    proto: udp
    host: any
